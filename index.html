.note{margin:-4px 0 0;font-size:13px;color:var(--white);overflow-wrap:anywhere}

.two{display:grid;grid-template-columns:.9fr 1fr;gap:18px;align-items:start}

.lg{color:var(--edge);font-size:13px;margin-right:4px}
.tk{border:2px solid var(--white);border-radius:16px;padding:30px 14px 20px;min-height:222px}
.bar{height:3px;background:rgba(255,255,255,.15);border-radius:3px;margin:18px 0 26px}.bar i{display:block;height:100%;background:var(--cyan);width:30%}

ul.tasks li{display:flex;gap:7px;align-items:flex-start;cursor:pointer;overflow-wrap:anywhere}
ul.tasks li::before{content:"";width:6px;height:6px;margin-top:6px;border-radius:50%;background:var(--cyan);flex:none}
ul.tasks li.done{color:var(--dim);text-decoration:line-through}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.apps a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--white);font-size:11px;font-weight:600}
.apps b{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 16px var(--display);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,10,4,.8);display:none;align-items:flex-end;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.box{width:100%;max-width:460px;max-height:80%;overflow-y:auto;background:var(--panel);border:2px solid var(--edge);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font:700 14px var(--display);letter-spacing:.12em}
.box p,.box li{margin:0;line-height:1.4;overflow-wrap:anywhere}
.box ul{margin:0;padding-left:18px}
.x{align-self:flex-end;background:none;border:1px solid var(--edge);color:var(--white);border-radius:8px;padding:4px 12px;cursor:pointer;font:inherit}
.bar2{display:flex;gap:8px}
.bar2 input{flex:1;min-width:0;background:#02100a;border:1px solid var(--edge);color:var(--white);border-radius:8px;padding:11px 12px;font:inherit;font-size:16px}
.bar2 button{background:var(--edge);color:#02140a;border:0;border-radius:8px;padding:0 16px;font:700 13px var(--display);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 16px;max-width:90%;z-index:30;display:none}
.toast.show{display:block}
</style>

<script>
/* Browser version: provides the same window.Android helpers the phone app has */
var APPPK={'YouTube':['www.youtube.com','com.google.android.youtube'],'TikTok':['www.tiktok.com','com.zhiliaoapp.musically'],'Facebook':['www.facebook.com','com.facebook.katana'],'WhatsApp':['wa.me','com.whatsapp'],'Messenger':['m.me','com.facebook.orca'],'Instagram':['www.instagram.com','com.instagram.android'],'Gmail':['mail.google.com','com.google.android.gm'],'Google':['www.google.com','com.google.android.googlequicksearchbox'],'Maps':['maps.google.com','com.google.android.apps.maps'],'Play Store':['play.google.com','com.android.vending']};
function appHref(a){
  if(!window.WEB||!APPPK[a.n])return a.u;
  var p=APPPK[a.n];
  return 'intent://'+p[0]+'/#Intent;scheme=https;package='+p[1]+';S.browser_fallback_url='+encodeURIComponent(a.u)+';end';
}
if(!window.Android){
  window.WEB=true;
  (function(){
    var LS=function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
    var SV=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    window.Android={
      hasKey:function(){return LS('ar_key','').length>0},
      setKey:function(k){SV('ar_key',(k||'').trim())},
      getModel:function(){return LS('ar_model','gemini-2.5-flash')},
      setModel:function(m){if(m)SV('ar_model',m)},
      openApp:function(){return false},
      speak:function(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';speechSynthesis.speak(u)}catch(e){}},
      listen:function(){
        if(!SR){if(window.onHeard)window.onHeard('');return}
        var rec=new SR();rec.lang='bn-BD';rec.interimResults=false;
        rec.onresult=function(e){window.onHeard(e.results[0][0].transcript)};
        rec.onerror=function(){window.onHeard('')};
        rec.start();
      },
      ask:function(id,prompt,sys,hist){
        var c=[];
        try{JSON.parse(hist).forEach(function(o){c.push({role:o.r,parts:[{text:o.t}]})})}catch(e){}
        c.push({role:'user',parts:[{text:prompt}]});
        fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(LS('ar_model','gemini-2.5-flash'))+':generateContent',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-goog-api-key':LS('ar_key','')},
          body:JSON.stringify({contents:c,system_instruction:{parts:[{text:sys}]}})
        }).then(function(r){return r.text().then(function(t){return{ok:r.ok,s:r.status,t:t}})})
        .then(function(x){
          if(!x.ok){window.onAI(id,'','HTTP '+x.s+' '+x.t.slice(0,160));return}
          var j=JSON.parse(x.t);
          var out=j.candidates[0].content.parts.map(function(p){return p.text||''}).join('');
          window.onAI(id,out,'');
        }).catch(function(e){window.onAI(id,'',String(e))});
      }
    };
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
  })();
}

<script>

    if(window.Android&&Android.hasKey()){
      lastQ=q;$('spk').innerHTML='&bull; THINKING &bull;';
      var sys='You are '+name+', a friendly voice assistant for a user in Bangladesh. Reply in the same language the user writes in (Bangla or English), in one to three short sentences, no markdown. Personality: '+soul+'. Facts the user asked you to remember: '+(mem.join('; ')||'none')+'.';
      Android.ask(++nid,q,sys,JSON.stringify(hist.slice(-8)));
      return;
    }
    var t=window.Android?'Settings খুলে Gemini API key বসান, তারপর আমি উত্তর দিতে পারব।':'এটা ডেমো মোড, আসল AI যুক্ত নয়। অ্যান্ড্রয়েড অ্যাপে key বসালে উত্তর দেব।';
    setTimeout(function(){say('ai',t)},300);
  }
  window.onAI=function(id,out,err){
    $('spk').innerHTML='&bull; READY &bull;';
    if(err){say('ai','সমস্যা হয়েছে: '+String(err).slice(0,180));return}
    hist.push({r:'user',t:lastQ});hist.push({r:'model',t:out});
    say('ai',out);speak(out);
  };
  window.onHeard=function(t){$('spk').innerHTML='&bull; READY &bull;';if(t)ask(t);else toast('শুনতে পাইনি, আবার বলুন')};

  function drawTasks(){
    var ul=$('tasks');ul.innerHTML='';
    tasks.slice(0,5).forEach(function(k){var li=document.createElement('li');li.className=k.d?'done':'';li.textContent=k.t;li.onclick=function(){k.d=k.d?0:1;save('ar_tasks',tasks);drawTasks()};ul.appendChild(li)});
    var done=tasks.filter(function(k){return k.d}).length;
    $('left').innerHTML=(tasks.length-done)+' left <span style="color:var(--orange)">&#9650;1</span> &rsaquo;';
    $('prog').style.width=(tasks.length?Math.max(8,Math.round(done/tasks.length*100)):8)+'%';
  }
  drawTasks();

  function open(html,after){$('box').innerHTML=html+'<button class="x" id="cls">Close</button>';$('sheet').className='sheet open';$('cls').onclick=close;if(after)after()}
  function close(){$('sheet').className='sheet'}
  $('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))close()});
  function pMemory(){open('<h2>MEMORY</h2>'+(mem.length?'<ul>'+mem.map(function(m){return'<li>'+esc(m)+'</li>'}).join('')+'</ul>':'<p>Nothing saved yet. In CHAT say "remember my favorite color is blue".</p>')+'<button class="x" id="clr">Clear memory</button>',function(){$('clr').onclick=function(){mem=[];save('ar_mem',mem);pMemory()}})}
  function pChat(){open('<h2>CHAT</h2><div class="bar2"><input id="ci" placeholder="Type here / এখানে লিখুন" autocomplete="off"><button id="cs">SEND</button></div><p style="color:var(--dim)">Try: open youtube, open tiktok, remember I like cricket, task buy milk</p>',function(){var go=function(){var v=$('ci').value.trim();$('ci').value='';if(v){close();ask(v)}};$('cs').onclick=go;$('ci').onkeydown=function(e){if(e.key==='Enter')go()};setTimeout(function(){$('ci').focus()},50)})}
  function pSoul(){open('<h2>SOUL</h2><p>Personality of your assistant.</p><div class="bar2"><input id="si" value="'+esc(soul)+'"><button id="ss">SAVE</button></div>',function(){$('ss').onclick=function(){soul=$('si').value;save('ar_soul',soul);toast('Soul saved');close()}})}
  function pSetting(){
    var A=window.Android;
    open('<h2>SETTINGS</h2><p>Assistant name</p><div class="bar2"><input id="ni" value="'+esc(name)+'"><button id="ns">SAVE</button></div>'+(A?'<p>Gemini API key</p><div class="bar2"><input id="ki" type="password" placeholder="'+(A.hasKey()?'saved (paste to replace)':'paste key here')+'" autocomplete="off"><button id="ks">SAVE</button></div><p>Model</p><div class="bar2"><input id="mi" value="'+esc(A.getModel())+'"><button id="ms">SAVE</button></div>':'<p style="color:var(--dim)">AI brain: demo mode in the browser. Use the Android app for real AI.</p>'),function(){
      $('ns').onclick=function(){name=$('ni').value||'Archeria';save('ar_name',name);toast('Saved');close()};
      if(A){
        $('ks').onclick=function(){var v=$('ki').value.trim();if(v){A.setKey(v);toast('Key saved');close()}};
        $('ms').onclick=function(){A.setModel($('mi').value.trim());toast('Saved');close()};
      }
    });
  }
  var pm={memory:pMemory,chat:pChat,soul:pSoul,setting:pSetting};
  Array.prototype.forEach.call(document.querySelectorAll('.node'),function(n){n.onclick=function(){pm[n.dataset.p]()}});
  $('sq').onclick=pSetting;
  $('tr').onclick=function(){open('<h2>LOG</h2>'+(log.length?'<ul>'+log.slice(-20).map(function(l){return'<li><b>'+(l.w==='me'?'You':'AI')+':</b> '+esc(l.t)+'</li>'}).join('')+'</ul>':'<p>No messages yet.</p>'))};
  $('vol').onclick=function(){if(window.Android){Android.listen();$('spk').innerHTML='&bull; LISTENING &bull;'}else pChat()};
  ['cam','front','scr'].forEach(function(id){$(id).onclick=function(){toast('Camera and screen share need the Android app. Not available in this version.')}});
  $('stop').onclick=function(){aiOn=!aiOn;this.textContent=aiOn?'STOP':'START';this.className='stop'+(aiOn?'':' off');$('spk').innerHTML=aiOn?'&bull; READY &bull;':'&bull; STOPPED &bull;';try{speechSynthesis.cancel()}catch(e){}};

  function lines(){
    var st=$('stage').getBoundingClientRect(),svg=$('lines');svg.setAttribute('viewBox','0 0 '+st.width+' '+st.height);
    var orb=$('orb').getBoundingClientRect(),tx=orb.left-st.left+6,cy=orb.top-st.top+orb.height/2;
    var cols={memory:'#27e3ff',chat:'#ff9a2e',soul:'#e9f5ee',setting:'#1fe86b'},h='';
    Array.prototype.forEach.call(document.querySelectorAll('.node'),function(n,i){
      var r=n.getBoundingClientRect(),x=r.right-st.left,y=r.top-st.top+r.height/2,ty=cy-14+i*9,bx=x+(tx-x)*0.2,dy=ty-y,sg=dy<0?-1:1,rr=Math.min(14,Math.abs(dy)/2),d=Math.abs(dy)<2?'M'+x+' '+y+' H'+tx:'M'+x+' '+y+' H'+(bx-rr)+' Q'+bx+' '+y+' '+bx+' '+(y+sg*rr)+' V'+(ty-sg*rr)+' Q'+bx+' '+ty+' '+(bx+rr)+' '+ty+' H'+tx;
      h+='<path d="'+d+'" fill="none" stroke="'+cols[n.dataset.p]+'" stroke-width="3" stroke-linecap="round"/>';
    });
    svg.innerHTML=h;
  }
  window.addEventListener('resize',lines);setTimeout(lines,60);setTimeout(lines,500);

  var cv=$('orb'),cx=cv.getContext('2d'),pts=[],ang=0,N=420;
  for(var i=0;i<N;i++){var u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u);pts.push({x:r*Math.cos(a),y:u,z:r*Math.sin(a),c:Math.random()<.7?0:1})}
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    var W=cv.width,R=W*0.34,c=W/2;cx.clearRect(0,0,W,W);
    ang+=0.006*speed*(aiOn?1:0.2);
    var ca=Math.cos(ang),sa=Math.sin(ang),tilt=0.45,ct=Math.cos(tilt),st=Math.sin(tilt);
    pts.forEach(function(p){
      var x=p.x*ca+p.z*sa,z=-p.x*sa+p.z*ca,y=p.y*ct-z*st;z=p.y*st+z*ct;
      var d=(z+1.4)/2.4,s=1+d*1.8;
      cx.fillStyle=p.c?'rgba(255,225,60,'+(0.35+d*.65)+')':'rgba(39,255,200,'+(0.35+d*.65)+')';
      cx.beginPath();cx.arc(c+x*R,c+y*R,s,0,6.283);cx.fill();
    });
    cx.strokeStyle='rgba(255,225,60,.75)';cx.lineWidth=2.5;cx.beginPath();cx.ellipse(c,c,R*1.2,R*.62,-0.5+ang*0.3,0,6.283);cx.stroke();
    cx.strokeStyle='rgba(39,255,200,.55)';cx.beginPath();cx.ellipse(c,c,R*.8,R*1.2,0.6,0,6.283);cx.stroke();
    if(!still)requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body></html>
